name: Build & Release

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all, windows, macos, linux)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

env:
  BUILD_TYPE: Release

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLATFORM="${{ github.event.inputs.platform }}"
          else
            PLATFORM="all"
          fi
          case "$PLATFORM" in
            windows)
              echo 'matrix=[{"os":"windows-latest","platform":"windows-x64"}]' >> $GITHUB_OUTPUT
              ;;
            macos)
              echo 'matrix=[{"os":"macos-latest","platform":"macos-arm64"}]' >> $GITHUB_OUTPUT
              ;;
            linux)
              echo 'matrix=[{"os":"ubuntu-latest","platform":"linux-x64"}]' >> $GITHUB_OUTPUT
              ;;
            *)
              echo 'matrix=[{"os":"ubuntu-latest","platform":"linux-x64"},{"os":"windows-latest","platform":"windows-x64"},{"os":"macos-latest","platform":"macos-arm64"}]' >> $GITHUB_OUTPUT
              ;;
          esac

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libasound2-dev libjack-dev libfreetype6-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libgl1-mesa-dev libxcomposite-dev libfontconfig1-dev \
            libcurl4-openssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev ladspa-sdk

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $retry = 0
          while ($retry -lt 3) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            $retry++
            Write-Host "Chocolatey failed (attempt $retry), retrying in 10s..."
            Start-Sleep -Seconds 10
          }
          # Add NSIS to current session PATH
          $nsisPath = 'C:\Program Files (x86)\NSIS'
          if (Test-Path $nsisPath) {
            Add-Content -Path $env:GITHUB_PATH -Value $nsisPath
            $env:Path = "$env:Path;$nsisPath"
            Write-Host "NSIS added to PATH: $nsisPath"
          } else {
            Write-Error "NSIS not installed at $nsisPath"
            exit 1
          }
          # Verify
          makensis -VERSION
          if ($LASTEXITCODE -ne 0) { Write-Error 'makensis not found!'; exit 1 }

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # Strip 'v' prefix and '-alpha' suffix to get clean version (e.g. v0.03-alpha -> 0.03)
          VERSION=$(echo "$TAG" | sed 's/^v//' | sed 's/-.*$//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag $TAG"

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DNEXTSTUDIO_VERSION=${{ steps.version.outputs.version || '0.0.0-dev' }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j 4

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build
          cpack -C ${{ env.BUILD_TYPE }} -G DEB
          cpack -C ${{ env.BUILD_TYPE }} -G TGZ

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd build
          cpack -C ${{ env.BUILD_TYPE }} -G NSIS

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build
          cpack -C ${{ env.BUILD_TYPE }} -G DragNDrop

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NextStudio-${{ matrix.platform }}
          path: |
            build/*.exe
            build/*.dmg
            build/*.deb
            build/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: NextStudio-*
          path: artifacts
          merge-multiple: true

      - name: List Artifacts
        run: ls -la artifacts/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true